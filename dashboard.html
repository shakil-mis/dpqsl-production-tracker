<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>DPQSL Live Production Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  html, body { height: 100%; background: #0a0e1a; }

  .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; display: inline-block; }
  .badge-line { background: #eff6ff; color: #1e40af; }

  /* ---------- DIGITAL SIGNAGE DASHBOARD (PUBLIC / TV DISPLAY) ---------- */
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  :root {
    --dash-bg-1: #0a0e1a;
    --dash-card: #141a2e;
    --dash-card-2: #10152a;
    --dash-border: #232b45;
    --dash-text: #e8ecf7;
    --dash-muted: #7c869c;
    --dash-gold: #f4c430;
    --dash-cyan: #29d3ff;
    --dash-green: #22c55e;
    --dash-yellow: #eab308;
    --dash-red: #ef4444;
    --dash-grad-1: #101830;
    --dash-grad-2: #0a0e1a;
    --dash-grad-3: #060810;
  }
  body.theme-light {
    --dash-bg-1: #eef1f6;
    --dash-card: #ffffff;
    --dash-card-2: #f6f8fb;
    --dash-border: #dfe4ee;
    --dash-text: #1e2532;
    --dash-muted: #6b7488;
    --dash-gold: #b8860b;
    --dash-cyan: #0d84a8;
    --dash-green: #15803d;
    --dash-yellow: #b45309;
    --dash-red: #dc2626;
    --dash-grad-1: #f7f9fc;
    --dash-grad-2: #eef1f6;
    --dash-grad-3: #e5e9f2;
  }
  .dashboard-view {
    display: flex; position: fixed; inset: 0; flex-direction: column;
    background: radial-gradient(circle at top left, var(--dash-grad-1) 0%, var(--dash-grad-2) 55%, var(--dash-grad-3) 100%);
    color: var(--dash-text); padding: 2vh 2vw; overflow: hidden;
  }
  .theme-toggle-btn {
    background: var(--dash-card); border: 1px solid var(--dash-border); color: var(--dash-text);
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 0.9vw;
    display: flex; align-items: center; justify-content: center; margin-left: 10px;
  }

  /* ---------- KPI SUMMARY ROW ---------- */
  .dash-kpi-row { flex: 0 0 auto; display: flex; gap: 0.9vw; margin-bottom: 1.2vh; }
  .kpi-card {
    flex: 1; background: var(--dash-card); border: 1px solid var(--dash-border); border-top: 3px solid var(--kpi-accent, var(--dash-cyan));
    border-radius: 10px; padding: 0.9vh 1vw; box-shadow: 0 4px 14px rgba(0,0,0,0.25); min-width: 0;
  }
  .kpi-label { font-size: 0.62vw; font-weight: 700; color: var(--dash-muted); letter-spacing: 0.4px; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi-value { font-size: 1.3vw; font-weight: 800; color: var(--dash-text); margin-top: 2px; white-space: nowrap; }
  .kpi-value .kpi-sub-pct { font-size: 0.72vw; font-weight: 700; color: var(--dash-muted); margin-left: 4px; }
  .kpi-extra { font-size: 0.6vw; margin-top: 3px; color: var(--dash-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi-extra.neg { color: var(--dash-red); }

  .dash-header { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2vh; padding-bottom: 1vh; border-bottom: 1px solid var(--dash-border); }
  .dash-logo { font-size: 1vw; font-weight: 800; letter-spacing: 1px; color: var(--dash-text); display: flex; align-items: center; gap: 10px; }
  .dash-logo .bolt { color: var(--dash-gold); }
  .dash-header-right { display: flex; align-items: center; }
  .dash-datetime { font-size: 0.80vw; font-weight: 600; color: var(--dash-muted); background: var(--dash-card); padding: 2px 8px; border-radius: 8px; border: 1px solid var(--dash-border); white-space: nowrap; }

  .dash-top-row { display: flex; gap: 1.4vw; flex: 0 0 32%; min-height: 190px; margin-bottom: 1.2vh; }
  .dash-panel { background: var(--dash-card); border: 1px solid var(--dash-border); border-radius: 14px; padding: 1.2vh 1.4vw; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.35); overflow: hidden; }
  .dash-panel-title { font-size: 1.05vw; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 1vh; display: flex; align-items: center; gap: 8px; padding-bottom: 0.8vh; flex-shrink: 0; }
  .dash-panel-title.gold { color: var(--dash-gold); border-bottom: 2px solid rgba(244,196,48,0.3); }
  .dash-panel-title.danger { color: var(--dash-red); border-bottom: 2px solid rgba(239,68,68,0.3); }

  .top-performers-panel { flex: 1.2; }
  .top-performers-wrap { display: flex; gap: 1vw; flex: 1; align-items: stretch; justify-content: center; min-height: 0; }
  .top-card {
    background: var(--dash-card-2); border-radius: 12px; padding: 2px 4px;
    display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; position: relative;
    box-shadow: 0 4px 15px rgba(1, 47, 78, 0.5); height: 100%; min-height: 0;
  }
  .top-card.side { flex: 0 0 27%; }
  .top-card.center { flex: 0 0 34%; }

  .top-card::before {
    content: ''; position: absolute; inset: -2px; border-radius: 14px;
    background: conic-gradient(from var(--angle), transparent 20%, var(--border-color-1), var(--border-color-2), transparent 80%);
    animation: rotateBorder 4s linear infinite; z-index: -1;
  }
  .top-card::after {
    content: ''; position: absolute; inset: 0; background: var(--dash-card-2); border-radius: 12px; z-index: -1;
  }

  @keyframes rotateBorder {
    to { --angle: 360deg; }
  }

  .rank-0 { --border-color-1: #ffe27a; --border-color-2: #f4b400; }
  .rank-1 { --border-color-1: #dfe4ea; --border-color-2: #707a8a; }
  .rank-2 { --border-color-1: #e3a25f; --border-color-2: #8c4a11; }

  .top-avatar-wrap { position: relative; flex-shrink: 0; }
  .top-avatar-inner { position: relative; display: block; }
  .top-avatar { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: #1c2340; display: block; border: 2px solid rgba(255,255,255,0.08); }
  .top-card.center .top-avatar { width: 96px; height: 96px; border-radius: 12px; }
  .top-medal {
    position: absolute; top: -7px; right: -7px; width: 26px; height: 26px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 7.5px; font-weight: 800; color: #1a1d29; border: 1.5px solid var(--dash-card-2); box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .top-medal.rank-0 { background: linear-gradient(135deg, #ffe27a, #f4b400); }
  .top-medal.rank-1 { background: linear-gradient(135deg, #dfe4ea, #a9b1bd); }
  .top-medal.rank-2 { background: linear-gradient(135deg, #e3a25f, #b06a30); }

  .top-details-bottom { text-align: left; min-width: 0; flex: 1; }
  .top-name { font-size: 0.9vw; font-weight: 800; color: var(--dash-text); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-card.center .top-name { font-size: 1.1vw; }
  .top-sub-info { font-size: 0.72vw; color: var(--dash-cyan); font-weight: 600; text-align: left; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-card.center .top-sub-info { font-size: 0.85vw; }
  .top-eff { font-size: 0.78vw; color: var(--dash-green); font-weight: 800; text-align: left; margin-top: 5px; }
  .top-card.center .top-eff { font-size: 0.95vw; }

  .low-perf-panel { flex: 0.8; }
  .low-perf-slider-container { width: 100%; overflow: hidden; flex: 1; position: relative; }
  .low-perf-track { display: flex; gap: 10px; transition: transform 0.5s ease-in-out; width: 100%; }
  .low-perf-card {
    flex: 0 0 calc((100% - 20px) / 3);
    background: var(--dash-card-2); border: 1px solid var(--dash-border); border-radius: 8px;
    padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .low-perf-card img { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; margin-bottom: 5px; border: 2px solid var(--dash-red); }
  .low-perf-card .lp-name { font-size: 0.82vw; font-weight: 700; color: var(--dash-text); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .low-perf-card .lp-id { font-size: 0.66vw; color: var(--dash-cyan); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .low-perf-card .lp-eff { font-size: 0.82vw; color: var(--dash-red); font-weight: 800; margin-top: 3px; }

  .dash-bottom-section { flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--dash-card); border-radius: 14px; padding: 1.6vh 1.6vw; border: 1px solid var(--dash-border); }
  .dash-line-header { flex: 0 0 auto; text-align: center; margin-bottom: 1.2vh; }
  .dash-line-header h2 { font-size: 1.4vw; font-weight: 800; letter-spacing: 0.5px; color: var(--dash-text); }
  .dash-line-header .dash-line-sub { font-size: 0.85vw; color: var(--dash-muted); margin-top: 2px; }
  .dash-line-header .dash-line-sub b { color: var(--dash-green); }
  .dash-line-dots { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  .dash-line-dots span { width: 8px; height: 8px; border-radius: 50%; background: #2a3350; display: inline-block; }
  .dash-line-dots span.active-dot { background: var(--dash-cyan); width: 22px; border-radius: 6px; }

  .dash-line-body { flex: 1 1 auto; overflow: hidden; position: relative; }
  .dash-perf-table { width: 100%; border-collapse: collapse; font-size: 0.8vw; }
  .dash-perf-table thead th { position: sticky; top: 0; background: var(--dash-card-2); color: var(--dash-muted); font-weight: 700; text-transform: uppercase; font-size: 0.65vw; padding: 8px 4px; border-bottom: 1px solid var(--dash-border); text-align: center; white-space: nowrap; }
  .dash-perf-table tbody td { padding: 6px 4px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--dash-text); }
  .dash-perf-avatar { width: 1.8vw; height: 1.8vw; border-radius: 50%; object-fit: cover; }
  .dash-eff-pill { display: inline-block; padding: 2px 8px; border-radius: 12px; font-weight: 800; }
  .eff-green { background: rgba(34,197,94,0.15); color: var(--dash-green); }
  .eff-yellow { background: rgba(234,179,8,0.15); color: var(--dash-yellow); }
  .eff-red { background: rgba(239,68,68,0.15); color: var(--dash-red); }
  .dash-empty { text-align: center; padding: 4vh; color: var(--dash-muted); font-size: 1.2vw; font-weight: 600; }

  .dash-offline-pill {
    display: none; position: fixed; bottom: 14px; right: 14px; background: var(--dash-red); color: #fff;
    padding: 6px 14px; border-radius: 20px; font-size: 0.75vw; font-weight: 700; z-index: 10;
  }
</style>
</head>
<body>

<!-- PUBLIC SIGNAGE DASHBOARD — no login required -->
<div id="dashboardView" class="dashboard-view">
  <div class="dash-header">
    <div class="dash-logo"><span class="bolt">⚡</span> OPERATOR PERFORMANCE TRACKING</div>
    <div class="dash-header-right">
      <div class="dash-datetime" id="dashDateTime">--</div>
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Switch theme">🌙</button>
    </div>
  </div>

  <div class="dash-kpi-row" id="dashKpiRow"></div>

  <div class="dash-top-row">
    <div class="dash-panel top-performers-panel">
      <div class="dash-panel-title gold">🏆 TOP 3 PERFORMERS OF ALL TIME</div>
      <div id="topPerformersWrap" class="top-performers-wrap"></div>
    </div>

    <div class="dash-panel low-perf-panel">
      <div class="dash-panel-title danger">⚠ NEEDS IMPROVEMENT (LOW PERFORMERS)</div>
      <div class="low-perf-slider-container">
        <div id="lowPerfTrack" class="low-perf-track"></div>
      </div>
    </div>
  </div>

  <div class="dash-bottom-section">
    <div class="dash-line-header">
      <h2 id="dashLineTitle">Loading...</h2>
      <div class="dash-line-sub">Line Total Efficiency: <b id="dashLineEff">0%</b></div>
      <div class="dash-line-dots" id="dashLineDots"></div>
    </div>
    <div class="dash-line-body" id="dashLineBody"></div>
  </div>
</div>

<div class="dash-offline-pill" id="offlinePill">⚠ Connection lost — retrying...</div>

<script>
// Works automatically on localhost AND after deployment (Render etc.)
const BASE_URL = window.location.origin;

// Operator photos live on Cloudinary now (permanent, survives redeploys).
// CLOUD_NAME is fetched once from the server so it's never hardcoded here.
let CLOUD_NAME = '';
async function loadCloudName() {
  try {
    const res = await fetch(`${BASE_URL}/api/public/config`);
    const result = await res.json();
    if (result.success) CLOUD_NAME = result.cloudName;
  } catch (err) { /* falls back to local /uploads below if this fails */ }
}
function opPhotoUrl(officeId) {
  if (CLOUD_NAME) return `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/dpqsl_operators/${officeId}.jpg`;
  return `${BASE_URL}/uploads/${officeId}.jpg`;
}

let dashboardLines = [];
let dashboardLineIndex = 0;
let dashboardTableScrollTimer = null;
let lowPerfInterval = null;
let lowPerfIndex = 0;

// ---------------- THEME (Dark / Light toggle, remembered per device) ----------------
function applyStoredTheme() {
  const saved = localStorage.getItem('dashboardTheme') || 'dark';
  document.body.classList.toggle('theme-light', saved === 'light');
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = saved === 'light' ? '☀️' : '🌙';
}
function toggleTheme() {
  const isLight = document.body.classList.toggle('theme-light');
  localStorage.setItem('dashboardTheme', isLight ? 'light' : 'dark');
  document.getElementById('themeToggleBtn').textContent = isLight ? '☀️' : '🌙';
}
applyStoredTheme();

function updateDashDateTime() {
  const now = new Date();
  document.getElementById('dashDateTime').textContent = `${now.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }).toUpperCase()} | ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
}

// Public, unauthenticated combined endpoint — built for this TV/signage display.
async function loadDashboardData() {
  try {
    const today = new Date().toISOString().split('T')[0];
    const res = await fetch(`${BASE_URL}/api/public/dashboard-data?date=${today}`);
    const result = await res.json();

    document.getElementById('offlinePill').style.display = 'none';

    if (!result.success) return;
    const { topPerformers, lowPerformers, productionSummary, kpis } = result.data;

    renderKpiRow(kpis);
    renderTopPerformers(topPerformers);
    renderLowPerformers(lowPerformers);

    dashboardLines = productionSummary || [];
    if (dashboardLines.length > 0) {
      if (dashboardLineIndex >= dashboardLines.length) dashboardLineIndex = 0;
      renderDashLineDots();
      renderDashboardLine(dashboardLineIndex);
    } else {
      document.getElementById('dashLineTitle').textContent = 'No Line Data';
      document.getElementById('dashLineEff').textContent = '0%';
      document.getElementById('dashLineDots').innerHTML = '';
      document.getElementById('dashLineBody').innerHTML = '<div class="dash-empty">No production data available for today</div>';
    }
  } catch (err) {
    console.error('Dashboard data load failed:', err);
    document.getElementById('offlinePill').style.display = 'block';
  }
}

function renderKpiRow(k) {
  const wrap = document.getElementById('dashKpiRow');
  if (!k) { wrap.innerHTML = ''; return; }

  const fmt = (n) => (n || 0).toLocaleString('en-US');

  wrap.innerHTML = `
    <div class="kpi-card" style="--kpi-accent: var(--dash-cyan);">
      <div class="kpi-label">📊 TOTAL LINES</div>
      <div class="kpi-value">${k.total_lines}</div>
    </div>
    <div class="kpi-card" style="--kpi-accent: var(--dash-green);">
      <div class="kpi-label">✅ ACHIEVED LINES</div>
      <div class="kpi-value">${k.achieved_lines}<span class="kpi-sub-pct">${k.achieved_pct}%</span></div>
    </div>
    <div class="kpi-card" style="--kpi-accent: var(--dash-yellow);">
      <div class="kpi-label">⚠️ WARNING LINES</div>
      <div class="kpi-value">${k.warning_lines}<span class="kpi-sub-pct">${k.warning_pct}%</span></div>
    </div>
    <div class="kpi-card" style="--kpi-accent: var(--dash-red);">
      <div class="kpi-label">⛔ CRITICAL LINES</div>
      <div class="kpi-value">${k.critical_lines}<span class="kpi-sub-pct">${k.critical_pct}%</span></div>
    </div>
    <div class="kpi-card" style="--kpi-accent: #f97316;">
      <div class="kpi-label">👥 TOTAL MANPOWER</div>
      <div class="kpi-value">${fmt(k.total_manpower)}</div>
    </div>
    <div class="kpi-card" style="--kpi-accent: var(--dash-cyan);">
      <div class="kpi-label">🎯 TOTAL TARGET</div>
      <div class="kpi-value">${fmt(k.total_target)}</div>
    </div>
    <div class="kpi-card" style="--kpi-accent: var(--dash-green);">
      <div class="kpi-label">📈 TOTAL OUTPUT</div>
      <div class="kpi-value">${fmt(k.total_output)}</div>
      <div class="kpi-extra ${k.output_shortfall > 0 ? 'neg' : ''}">${k.output_shortfall > 0 ? `↘ Less: ${fmt(k.output_shortfall)}` : '✓ Target met'}</div>
    </div>
    <div class="kpi-card" style="--kpi-accent: #a855f7;">
      <div class="kpi-label">◔ OVERALL EFFICIENCY</div>
      <div class="kpi-value">${k.overall_efficiency}%</div>
      <div class="kpi-extra ${k.efficiency_gap > 0 ? 'neg' : ''}">${k.efficiency_gap > 0 ? `↘ Less: ${k.efficiency_gap}%` : '✓ On target'} &nbsp;|&nbsp; Avg IE Target: ${k.avg_ie_target}%</div>
    </div>
  `;
}

function renderTopPerformers(list) {
  const medalLabels = ['GOLD', 'SILVER', 'BRONZE'];
  const wrap = document.getElementById('topPerformersWrap');
  if (!list || list.length === 0) {
    wrap.innerHTML = '<div class="dash-empty" style="width:100%;">Top performers data unavailable</div>';
    return;
  }

  const top3 = list.slice(0, 3);
  const podiumOrder = [1, 0, 2];

  wrap.innerHTML = podiumOrder.map(rankIdx => {
    const p = top3[rankIdx];
    if (!p) return '';
    const sizeClass = rankIdx === 0 ? 'center' : 'side';
    return `
      <div class="top-card rank-${rankIdx} ${sizeClass}">
        <div class="top-avatar-wrap">
          <span class="top-avatar-inner">
            <img class="top-avatar" src="${opPhotoUrl(p.office_id)}" onerror="this.src='${BASE_URL}/uploads/default.jpg'">
            <div class="top-medal rank-${rankIdx}">${medalLabels[rankIdx]}</div>
          </span>
        </div>
        <div class="top-details-bottom">
          <div class="top-name">${p.operator_name}</div>
          <div class="top-sub-info">ID: ${p.office_id} | ${p.line_name || 'N/A'}</div>
          <div class="top-eff">EFF: ${p.efficiency}%</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderLowPerformers(list) {
  const track = document.getElementById('lowPerfTrack');
  if (lowPerfInterval) clearInterval(lowPerfInterval);

  // Reset to a clean, static position first — otherwise if this re-render lands
  // mid-scroll (it runs every 30s on auto-refresh), the new cards would inherit
  // whatever transform% was left over from the old carousel and visibly jump/shake.
  track.style.transition = 'none';
  track.style.transform = 'translateX(0%)';

  if (!list || list.length === 0) {
    track.innerHTML = '<div class="dash-empty" style="width:100%;">No low performance record</div>';
    return;
  }

  let items = [...list];
  if (items.length > 3) {
    items = [...items, ...items.slice(0, 3)];
  }

  track.innerHTML = items.map(p => `
    <div class="low-perf-card">
      <img src="${opPhotoUrl(p.office_id)}" onerror="this.src='${BASE_URL}/uploads/default.jpg'">
      <div class="lp-name">${p.operator_name}</div>
      <div class="lp-id">ID: ${p.office_id} &nbsp;|&nbsp; ${p.line_name || 'N/A'}</div>
      <div class="lp-eff">EFF: ${p.efficiency}%</div>
    </div>
  `).join('');

  if (list.length > 3) {
    lowPerfIndex = 0;
    const cardWidthPercentage = 100 / 3;

    lowPerfInterval = setInterval(() => {
      lowPerfIndex++;
      track.style.transition = 'transform 0.5s ease-in-out';
      track.style.transform = `translateX(-${lowPerfIndex * cardWidthPercentage}%)`;

      if (lowPerfIndex >= list.length) {
        setTimeout(() => {
          track.style.transition = 'none';
          lowPerfIndex = 0;
          track.style.transform = `translateX(0%)`;
        }, 500);
      }
    }, 3000);
  } else {
    track.style.transform = 'translateX(0%)';
  }
}

function renderDashLineDots() {
  document.getElementById('dashLineDots').innerHTML = dashboardLines.map((l, i) =>
    `<span class="${i === dashboardLineIndex ? 'active-dot' : ''}"></span>`
  ).join('');
}

function startDashTableAutoScroll(container) {
  if (dashboardTableScrollTimer) cancelAnimationFrame(dashboardTableScrollTimer);

  let scrollPos = 0;
  let phase = 'scroll';
  let phaseStart = null;
  let lastTs = null;
  const SPEED = 22;
  const PAUSE_MS = 1800;

  function frame(ts) {
    if (lastTs === null) lastTs = ts;
    const dt = ts - lastTs;
    lastTs = ts;

    const maxScroll = container.scrollHeight - container.clientHeight;

    if (maxScroll <= 2) {
      dashboardTableScrollTimer = requestAnimationFrame(frame);
      return;
    }
    if (scrollPos > maxScroll) scrollPos = maxScroll;

    if (phase === 'scroll') {
      scrollPos += (SPEED * dt) / 1000;
      if (scrollPos >= maxScroll) {
        scrollPos = maxScroll;
        phase = 'pauseBottom';
        phaseStart = ts;
      }
      container.scrollTop = scrollPos;
    } else if (phase === 'pauseBottom') {
      if (ts - phaseStart >= PAUSE_MS) {
        scrollPos = 0;
        container.scrollTop = 0;
        phase = 'pauseTop';
        phaseStart = ts;
      }
    } else if (phase === 'pauseTop') {
      if (ts - phaseStart >= PAUSE_MS) {
        phase = 'scroll';
      }
    }

    dashboardTableScrollTimer = requestAnimationFrame(frame);
  }

  dashboardTableScrollTimer = requestAnimationFrame(frame);
}

function renderDashboardLine(idx) {
  if (dashboardTableScrollTimer) cancelAnimationFrame(dashboardTableScrollTimer);
  const lineObj = dashboardLines[idx];
  if (!lineObj) return;

  document.getElementById('dashLineTitle').textContent = `NOW SHOWING: ${lineObj.line_name} - OPERATOR MATRIX`;
  document.getElementById('dashLineEff').textContent = `${lineObj.line_efficiency || 0}%`;
  renderDashLineDots();

  const body = document.getElementById('dashLineBody');
  if (!lineObj.operators || lineObj.operators.length === 0) {
    body.innerHTML = '<div class="dash-empty">No active operator data for today</div>';
    return;
  }

  const hourLabels = ['08-09','09-10','10-11','11-12','12-01','02-03','03-04','04-05','05-06','06-07'];
  const hourKeys = ['h1','h2','h3','h4','h5','h6','h7','h8','h9','h10'];

  const sortedOperators = [...lineObj.operators].sort((a, b) => (parseFloat(b.efficiency) || 0) - (parseFloat(a.efficiency) || 0));

  const rows = sortedOperators.map(op => `
    <tr>
      <td><span class="badge badge-line">${lineObj.line_name}</span></td>
      <td><img class="dash-perf-avatar" src="${opPhotoUrl(op.office_id)}" onerror="this.src='${BASE_URL}/uploads/default.jpg'"></td>
      <td><strong>${op.office_id}</strong></td>
      <td>${op.operator_name}</td>
      <td>${op.hourly_target}</td>
      ${hourKeys.map(k => `<td>${op[k] || 0}</td>`).join('')}
      <td><strong>${op.total_prod}</strong></td>
      <td>${op.total_defect || 0}</td>
      <td>${op.downtime_minute || 0}</td>
      <td><span class="dash-eff-pill ${op.efficiency >= 95 ? 'eff-green' : op.efficiency >= 75 ? 'eff-yellow' : 'eff-red'}">${op.efficiency}%</span></td>
    </tr>
  `).join('');

  body.innerHTML = `
    <table class="dash-perf-table" id="linePerfTable">
      <thead>
        <tr>
          <th>Line</th><th>PIC</th><th>ID</th><th>Name</th><th>Target/Hr</th>
          ${hourLabels.map(h => `<th>${h}</th>`).join('')}
          <th>Total Pcs</th><th>Defect</th><th>Downtime (Min)</th><th>Calculated Eff %</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  setTimeout(() => {
    const table = document.getElementById('linePerfTable');
    if (table) startDashTableAutoScroll(body);
  }, 300);
}

function rotateDashboardLine() {
  if (!dashboardLines.length) return;
  dashboardLineIndex = (dashboardLineIndex + 1) % dashboardLines.length;
  renderDashboardLine(dashboardLineIndex);
}

// ---------------- INIT ----------------
updateDashDateTime();
setInterval(updateDashDateTime, 10000);

loadCloudName().then(loadDashboardData);
setInterval(loadDashboardData, 30000);       // ✅ auto-refresh every 30s, per spec
setInterval(rotateDashboardLine, 30000);      // rotate to next line every 30s
</script>
