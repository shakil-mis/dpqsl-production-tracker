<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | DPQSL Production Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --accent: #4f7cff;
    --accent-dark: #3a5fd9;
    --dark: #1a1d29;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top left, #1e2540 0%, #10131f 60%, #06070c 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .login-card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 36px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .brand {
    text-align: center;
    margin-bottom: 28px;
  }
  .brand .logo-badge {
    width: 56px; height: 56px; border-radius: 14px;
    /* background: linear-gradient(135deg, var(--accent), var(--accent-dark)); */
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 22px;
    margin: 0 auto 14px;
  }

  .brand h1 { font-size: 20px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
  .brand p { font-size: 13px; color: #6b7280; }
  .form-label { font-size: 13px; font-weight: 600; color: #374151; }
  .form-control { padding: 10px 14px; border-radius: 8px; border: 1px solid #e2e4ea; }
  .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 0.2rem rgba(79,124,255,0.15); }
  .btn-login {
    background: var(--accent); border: none; color: #fff; font-weight: 600;
    padding: 11px; border-radius: 8px; width: 100%; margin-top: 6px;
  }
  .btn-login:hover { background: var(--accent-dark); color: #fff; }
  .btn-login:disabled { opacity: 0.7; }
  #errorBox {
    display: none; background: #fdecec; color: #c0392b; border: 1px solid #f5c6cb;
    border-radius: 8px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 16px; font-weight: 500;
  }
  .signage-link {
    text-align: center; margin-top: 22px; font-size: 12.5px;
  }
  .signage-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <div class="logo-badge"><img src="logo-1.png" alt="" height="100"></div>
    <h1>DPQSL Production Tracker</h1>
    <p>Sign in to access your workspace</p>
  </div>

  <div id="errorBox"></div>

  <form id="loginForm" novalidate>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" id="username" placeholder="e.g. admin" autocomplete="username" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-login" id="loginBtn">Sign In</button>
  </form>

  <div class="signage-link">
    Just here for the live board? <a href="dashboard.html" target="_blank">Open Display Dashboard</a>
  </div>
</div>

<script>
// Works automatically on localhost AND after deployment (Render etc.) —
// since server.js serves this page and the API from the same origin.
const BASE_URL = window.location.origin;

// If already logged in, skip straight to the app
if (localStorage.getItem('token')) {
  window.location.href = 'index.html';
}

const form = document.getElementById('loginForm');
const errorBox = document.getElementById('errorBox');
const loginBtn = document.getElementById('loginBtn');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    showError('Please enter both username and password.');
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing in...';

  try {
    const res = await fetch(`${BASE_URL}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const result = await res.json();

    if (result.success) {
      localStorage.setItem('token', result.token);
      localStorage.setItem('user', JSON.stringify(result.user));
      window.location.href = 'index.html';
    } else {
      showError(result.message || 'Invalid username or password.');
    }
  } catch (err) {
    showError('Unable to reach the server. Please check your connection.');
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
